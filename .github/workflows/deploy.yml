# .github/workflows/deploy.yml
#
# Builds the Docker image and deploys to Azure App Service (Australia East)
# on every push to main.
#
# Required GitHub repository secrets (set in Settings → Secrets and variables → Actions):
#   AZURE_CREDENTIALS        — Service principal JSON from `az ad sp create-for-rbac`
#   REGISTRY_LOGIN_SERVER    — e.g. sociogramacr.azurecr.io
#   REGISTRY_USERNAME        — ACR admin username
#   REGISTRY_PASSWORD        — ACR admin password
#   AZURE_WEBAPP_NAME        — e.g. sociogram-generator

name: Build and deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allows manual trigger from GitHub Actions UI

env:
  IMAGE_NAME: sociogram-generator

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build \
            --tag ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Log out of Azure
        if: always()
        run: az logout
